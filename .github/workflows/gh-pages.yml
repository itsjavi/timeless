# Workflow for deploying static content to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch, unless the push touched nothing the deployed site
  # can contain. The filter is a deny-list on purpose: a new source directory should deploy by
  # default, and only paths proven absent from `dist-site` are listed. Markdown is never ignored
  # wholesale — apps/web/src/lib/grammar.ts reads `packages/components/skills/**/reference/*.md` at
  # build time, and apps/stories imports `*.stories.md`.
  push:
    branches: ['main']
    paths-ignore:
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.vscode/**'
      - 'apps/e2e/**'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/pr-quality.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'README.md'

  # Allows you to run this workflow manually from the Actions tab, including to publish a change the
  # filter above skipped.
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build Pages artifact
        run: pnpm build:site
        env:
          # Only the deployed site loads analytics; see apps/web/src/layouts/SiteLayout.astro.
          PUBLIC_ENABLE_ANALYTICS: 'true'

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
