name: PR Quality Checks

on:
  push:
    branches: [develop, 'release/**']
  pull_request:
    branches: ['**']

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package-contracts:
    name: package-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build packages
        run: pnpm build:packages
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Validate published package contracts
        # `contracts:check` is the same aggregate `pnpm qa` runs, so a green local gate means a green
        # CI job. Listing these here and not there is how a `createElement` reached CI once already.
        run: |
          pnpm contracts:check
          pnpm -F @timelessui/components manifest:validate
          pnpm publint
          pnpm attw

  static-site:
    name: static-site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build composed site
        run: pnpm build:site
      - name: Validate examples and documentation
        # `test` reads source and runs in package-contracts too. `test:dist` reads the emitted site, so
        # it can only run here, after `build:site` — that split is why `apps/web` has two test scripts.
        run: |
          pnpm -F @timelessui/examples test
          pnpm -F @apps/web test
          pnpm -F @apps/web test:dist
      - uses: actions/upload-artifact@v6
        with:
          name: static-site
          path: dist-site

  browser-contracts:
    name: browser-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          show-progress: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm build:site
      - name: Install browser engines
        run: pnpm -F @apps/e2e exec playwright install --with-deps chromium firefox webkit
      - name: Website, documentation, and StoryLite browser gates
        run: pnpm -F @apps/e2e exec playwright test
      - name: Composite deployment browser gates
        run: pnpm -F @apps/e2e run e2e:site
