user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log off; # prevent filling up the disk

    sendfile on;
    #tcp_nopush     on;

    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # include /etc/nginx/conf.d/*.conf; # this would add the default.conf website, but we don't need it

    server {
        listen       80;
        server_name  _;
        absolute_redirect off;
        
        root /webapp/www;
        index index.html;

        location = /ui {
            return 301 /stories/;
        }

        location ^~ /ui/ {
            return 301 /stories/;
        }

        location ^~ /_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ^~ /stories/storylite-assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ^~ /stories/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|woff2)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        error_page 404 /404.html;
    }
}
